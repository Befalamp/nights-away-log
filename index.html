<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2f4636">
<title>Nights Away Log</title>
<style>
  :root {
    --ink: #23201c;
    --paper: #f7f3ec;
    --card: #ffffff;
    --line: #ded5c6;
    --moss: #46664e;
    --moss-dark: #2f4636;
    --clay: #a8543a;
    --muted: #857c70;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
    margin: 0;
    padding: 18px 14px 60px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 21px; font-weight: 600; margin: 0 0 2px; color: var(--moss-dark); }
  .sub { font-size: 13px; color: var(--muted); margin: 0 0 16px; }

  .sync {
    font-size: 12px;
    margin: 0 0 16px;
    padding: 8px 12px;
    border-radius: 8px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--muted);
  }
  .sync.error { color: var(--clay); border-color: var(--clay); }
  .sync.ok { color: var(--moss-dark); }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 12px;
    color: var(--moss-dark);
    font-weight: 600;
  }

  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
  }
  .stat .num { font-size: 22px; font-weight: 700; color: var(--moss-dark); }
  .stat .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  label:first-child { margin-top: 0; }
  input[type="text"], input[type="date"], input[type="number"], select, textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    color: var(--ink);
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 50px; }

  .checkrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .checkrow label.chip {
    display: flex; align-items: center; gap: 6px;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 13px;
    color: var(--ink);
    margin: 0;
    cursor: pointer;
    background: #fff;
  }
  .checkrow input[type="checkbox"] { width: auto; margin: 0; }
  .checkrow label.chip.checked { background: var(--moss); color: #fff; border-color: var(--moss); }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    border: none;
    padding: 10px 16px;
    cursor: pointer;
  }
  .btn-primary { background: var(--moss-dark); color: #fff; width: 100%; margin-top: 14px; }
  .btn-primary:disabled { opacity: 0.5; }
  .btn-secondary { background: #fff; color: var(--moss-dark); border: 1px solid var(--moss-dark); }
  .btn-danger { background: #fff; color: var(--clay); border: 1px solid var(--clay); font-size: 12px; padding: 5px 10px; }
  .btn-small { font-size: 12px; padding: 5px 10px; }

  .filterbar { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
  .filterbar > div { flex: 1; min-width: 130px; }
  .filterbar button { flex: 0 0 auto; }

  .entry {
    border-bottom: 1px solid var(--line);
    padding: 12px 0;
  }
  .entry:last-child { border-bottom: none; }
  .entry-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .entry-date { font-weight: 700; color: var(--moss-dark); font-size: 14px; }
  .entry-nights { font-size: 12px; color: var(--muted); }
  .entry-types { font-size: 12px; color: var(--clay); margin-top: 2px; }
  .entry-meta { font-size: 13px; margin-top: 4px; }
  .entry-notes { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .entry-actions { margin-top: 6px; display: flex; gap: 6px; }

  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 0; }

  @media print {
    body { background: #fff; padding: 0; }
    .no-print { display: none !important; }
    .card { border: none; padding: 0; margin-bottom: 10px; }
    .entry { break-inside: avoid; }
    .stats { grid-template-columns: 1fr 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>Nights Away Log</h1>
  <p class="sub">Greenfield Nights Away Permit — experience record</p>

  <div id="syncStatus" class="sync no-print">Connecting…</div>

  <!-- ADD ENTRY -->
  <div class="card no-print">
    <h2>Log an event</h2>

    <label for="fDate">Date</label>
    <input type="date" id="fDate">

    <label>Type</label>
    <div class="checkrow" id="typeChips">
      <label class="chip"><input type="checkbox" value="Indoor"> Indoor</label>
      <label class="chip"><input type="checkbox" value="Campsite"> Campsite</label>
      <label class="chip"><input type="checkbox" value="Greenfield"> Greenfield</label>
    </div>

    <div class="row2">
      <div>
        <label for="fRole">Role</label>
        <select id="fRole">
          <option value="LIC">Leader in Charge (LIC)</option>
          <option value="Deputy">Deputy</option>
          <option value="Team member">Team member</option>
        </select>
      </div>
      <div>
        <label for="fNights">Nights</label>
        <input type="number" id="fNights" min="1" step="1" value="1">
      </div>
    </div>

    <label for="fVenue">Venue</label>
    <input type="text" id="fVenue" placeholder="e.g. Longmynd Field">

    <label for="fYP">Young people attending</label>
    <input type="number" id="fYP" min="0" step="1">

    <label for="fNotes">Notes</label>
    <textarea id="fNotes" placeholder="Anything worth remembering — group, section, weather, incidents, etc."></textarea>

    <button class="btn-primary" id="addBtn" onclick="addEntry()">Add to log</button>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat"><div class="num" id="statEvents">0</div><div class="lbl">Events</div></div>
    <div class="stat"><div class="num" id="statNights">0</div><div class="lbl">Nights</div></div>
    <div class="stat"><div class="num" id="statTypes">0</div><div class="lbl">Types covered</div></div>
  </div>

  <!-- FILTER -->
  <div class="card no-print">
    <h2>Showing</h2>
    <div class="filterbar">
      <div>
        <label for="filterFrom">From</label>
        <input type="date" id="filterFrom">
      </div>
      <div>
        <label for="filterTo">To</label>
        <input type="date" id="filterTo">
      </div>
      <button class="btn-secondary btn-small" onclick="setDefaultRange()">Since permit issued</button>
      <button class="btn-secondary btn-small" onclick="setAllRange()">Show all</button>
    </div>
    <button class="btn-secondary btn-small" style="margin-top:10px;" onclick="window.print()">Print this view</button>
  </div>

  <!-- LOG -->
  <div class="card" id="logCard">
    <h2>Log</h2>
    <div id="logList"><div class="empty">Loading…</div></div>
  </div>

  <!-- SETTINGS (rarely touched — once every 5 years) -->
  <details class="card no-print">
    <summary style="cursor:pointer; font-size:14px; font-weight:600; color:var(--moss-dark);">Permit settings</summary>
    <div style="margin-top:12px;">
      <label for="permitDate">Permit issue date</label>
      <input type="date" id="permitDate">
      <button class="btn-secondary btn-small" style="margin-top:8px;" onclick="saveSettings()">Save permit date</button>
    </div>
  </details>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  // ---- FIREBASE CONFIG ----
  // Replace with your own Firebase project config (Project settings > General > Your apps > SDK config).
  // Same Firebase project pattern as the notes app / book tracker.
  const firebaseConfig = {
    apiKey: "AIzaSyBuoSD6KbVWGjg7-u2mTJhqX1MrplQA4g4",
    authDomain: "nights-away-log.firebaseapp.com",
    projectId: "nights-away-log",
    storageBucket: "nights-away-log.firebasestorage.app",
    messagingSenderId: "127756546051",
    appId: "1:127756546051:web:4858581777704204645e36"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const eventsCol = db.collection('nightsAwayEvents');
  const settingsDoc = db.collection('nightsAwaySettings').doc('main');

  let allEvents = [];
  let permitDate = null;

  const statusEl = document.getElementById('syncStatus');
  function setStatus(msg, cls) {
    statusEl.textContent = msg;
    statusEl.className = 'sync no-print' + (cls ? ' ' + cls : '');
  }

  function fmtDate(d) {
    if (!d) return '';
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  // ---- SETTINGS ----
  function loadSettings() {
    settingsDoc.get().then(doc => {
      if (doc.exists && doc.data().permitDate) {
        permitDate = doc.data().permitDate;
        document.getElementById('permitDate').value = permitDate;
      }
      setDefaultRange();
    }).catch(err => {
      console.error(err);
      setDefaultRange();
    });
  }

  function saveSettings() {
    const val = document.getElementById('permitDate').value;
    settingsDoc.set({ permitDate: val }, { merge: true }).then(() => {
      permitDate = val;
      setStatus('Permit date saved.', 'ok');
    }).catch(err => {
      setStatus('Could not save permit date: ' + err.message, 'error');
    });
  }

  // ---- FILTER RANGE ----
  function setDefaultRange() {
    document.getElementById('filterFrom').value = permitDate || '';
    document.getElementById('filterTo').value = new Date().toISOString().slice(0, 10);
    render();
  }
  function setAllRange() {
    document.getElementById('filterFrom').value = '';
    document.getElementById('filterTo').value = '';
    render();
  }
  document.getElementById('filterFrom').addEventListener('change', render);
  document.getElementById('filterTo').addEventListener('change', render);

  // ---- CHIP STYLING ----
  document.querySelectorAll('#typeChips input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', () => {
      cb.closest('label').classList.toggle('checked', cb.checked);
    });
  });

  // ---- ADD ENTRY ----
  function addEntry() {
    const date = document.getElementById('fDate').value;
    if (!date) { alert('Please set a date.'); return; }
    const types = Array.from(document.querySelectorAll('#typeChips input:checked')).map(cb => cb.value);
    if (types.length === 0) { alert('Please tick at least one type.'); return; }
    const role = document.getElementById('fRole').value;
    const nights = Number(document.getElementById('fNights').value) || 1;
    const venue = document.getElementById('fVenue').value.trim();
    const yp = document.getElementById('fYP').value ? Number(document.getElementById('fYP').value) : null;
    const notes = document.getElementById('fNotes').value.trim();

    const addBtn = document.getElementById('addBtn');
    addBtn.disabled = true;

    eventsCol.add({ date, types, role, nights, venue, yp, notes, created: Date.now() })
      .then(() => {
        document.getElementById('fVenue').value = '';
        document.getElementById('fYP').value = '';
        document.getElementById('fNotes').value = '';
        document.getElementById('fNights').value = 1;
        document.querySelectorAll('#typeChips input').forEach(cb => { cb.checked = false; cb.closest('label').classList.remove('checked'); });
        setStatus('Saved.', 'ok');
      })
      .catch(err => setStatus('Could not save: ' + err.message, 'error'))
      .finally(() => { addBtn.disabled = false; });
  }

  function deleteEntry(id) {
    if (!confirm('Delete this entry?')) return;
    eventsCol.doc(id).delete()
      .then(() => setStatus('Deleted.', 'ok'))
      .catch(err => setStatus('Could not delete: ' + err.message, 'error'));
  }

  // ---- LIVE SYNC ----
  eventsCol.orderBy('date', 'desc').onSnapshot(snap => {
    allEvents = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    setStatus('Synced — ' + allEvents.length + ' event' + (allEvents.length === 1 ? '' : 's') + ' in total.', 'ok');
    render();
  }, err => {
    setStatus('Sync error: ' + err.message, 'error');
  });

  // ---- RENDER ----
  function render() {
    const from = document.getElementById('filterFrom').value;
    const to = document.getElementById('filterTo').value;

    const filtered = allEvents.filter(e => {
      if (from && e.date < from) return false;
      if (to && e.date > to) return false;
      return true;
    });

    const totalNights = filtered.reduce((s, e) => s + (Number(e.nights) || 0), 0);
    const typesSeen = new Set();
    filtered.forEach(e => (e.types || []).forEach(t => typesSeen.add(t)));

    document.getElementById('statEvents').textContent = filtered.length;
    document.getElementById('statNights').textContent = totalNights;
    document.getElementById('statTypes').textContent = typesSeen.size + ' / 3';

    const list = document.getElementById('logList');
    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty">No events in this range yet.</div>';
      return;
    }

    list.innerHTML = filtered.map(e => `
      <div class="entry">
        <div class="entry-top">
          <div class="entry-date">${fmtDate(e.date)}</div>
          <div class="entry-nights">${e.nights} night${e.nights == 1 ? '' : 's'}</div>
        </div>
        <div class="entry-types">${(e.types || []).join(' + ')}</div>
        <div class="entry-meta">${e.role}${e.venue ? ' at ' + e.venue : ''}${e.yp != null ? ' — ' + e.yp + ' young people' : ''}</div>
        ${e.notes ? `<div class="entry-notes">${e.notes.replace(/</g, '&lt;')}</div>` : ''}
        <div class="entry-actions no-print">
          <button class="btn-danger" onclick="deleteEntry('${e.id}')">Delete</button>
        </div>
      </div>
    `).join('');
  }

  loadSettings();
</script>
</body>
</html>
